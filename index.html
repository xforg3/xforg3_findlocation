<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>SMILE - Face Capture</title>
    
    <!-- ============================================================
    STYLE
    ============================================================ -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 32px 24px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .logo {
            font-size: 56px;
            margin-bottom: 6px;
            display: block;
        }

        .header h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 4px;
        }

        /* ===== SESSION INFO ===== */
        .session-info {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .session-info .label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .session-info .value {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 12px;
            border-radius: 8px;
        }

        .session-info .status-badge {
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-badge.waiting {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .status-badge.done {
            background: rgba(52, 211, 153, 0.2);
            color: #34d399;
        }

        /* ===== CAMERA WRAPPER ===== */
        .camera-wrapper {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.06);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transform: scaleX(-1);
        }

        #photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(255, 255, 255, 0.3);
            gap: 12px;
            padding: 20px;
        }

        .placeholder .icon {
            font-size: 64px;
        }

        .placeholder p {
            font-size: 15px;
            text-align: center;
            line-height: 1.5;
        }

        .placeholder .sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
        }

        /* ===== CAMERA OVERLAY ===== */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .overlay.active {
            display: flex;
        }

        .overlay .frame {
            width: 70%;
            height: 70%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { border-color: rgba(255, 255, 255, 0.2); }
            50% { border-color: rgba(255, 255, 255, 0.6); }
        }

        /* ===== BUTTONS ===== */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            min-width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #fff;
            box-shadow: 0 4px 20px rgba(52, 211, 153, 0.3);
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(52, 211, 153, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: #fff;
            box-shadow: 0 4px 20px rgba(248, 113, 113, 0.3);
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(248, 113, 113, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a1a2e;
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
        }

        .btn-warning:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.4);
        }

        .btn-full {
            flex: 0 0 100%;
        }

        /* ===== STATUS MESSAGE ===== */
        #status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        #status.success {
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.15);
            display: block;
        }

        #status.error {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.15);
            display: block;
        }

        #status.info {
            background: rgba(96, 165, 250, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.15);
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== LOADER ===== */
        #loader {
            display: none;
            text-align: center;
            margin-top: 16px;
            padding: 16px;
        }

        #loader.active {
            display: block;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loader p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
                border-radius: 24px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header .logo {
                font-size: 44px;
            }

            .controls .btn {
                font-size: 13px;
                padding: 12px 14px;
                min-width: 60px;
            }

            .session-info {
                flex-wrap: wrap;
                gap: 6px;
            }

            .session-info .value {
                font-size: 12px;
                padding: 2px 10px;
            }
        }

        @media (max-width: 380px) {
            .controls .btn {
                font-size: 12px;
                padding: 10px 10px;
                min-width: 50px;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================================
    MAIN CONTAINER
    ============================================================ -->
    <div class="container">
        
        <!-- Header -->
        <div class="header">
            <span class="logo">📸</span>
            <h1>SMILE</h1>
            <p>Face Capture &amp; Verification</p>
        </div>

        <!-- Session Info -->
        <div class="session-info" id="sessionInfo">
            <span class="label">Session ID</span>
            <span class="value" id="sessionId">-</span>
            <span class="status-badge waiting" id="statusBadge">⏳ Menunggu</span>
        </div>

        <!-- Camera -->
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline></video>
            <img id="photo" alt="Hasil foto" />
            
            <div class="placeholder" id="placeholder">
                <span class="icon">🤳</span>
                <p>Klik tombol di bawah<br />untuk mulai kamera</p>
                <span class="sub">Pastikan izinkan akses kamera</span>
            </div>

            <div class="overlay" id="overlay">
                <div class="frame"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn btn-primary" id="btnStart">📷 Mulai</button>
            <button class="btn btn-success" id="btnCapture" disabled>📸 Ambil</button>
            <button class="btn btn-secondary" id="btnRetake" style="display:none;">🔄 Ulangi</button>
            <button class="btn btn-danger" id="btnSend" style="display:none;">📤 Kirim</button>
        </div>

        <!-- Status -->
        <div id="status"></div>

        <!-- Loader -->
        <div id="loader">
            <div class="spinner"></div>
            <p>Mengirim foto ke server...</p>
        </div>

        <!-- Footer -->
        <div class="footer">SMILE Face Capture v2.0 &bull; <span id="versionInfo">🔐 Secure</span></div>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 🔧 KONFIGURASI
            // ============================================================
            const API_BASE = 'https://smile-capture.workers.dev'; // GANTI DENGAN URL WORKER KAMU

            // Ambil session ID dari URL (contoh: /capture/ABC12345)
            const pathSegments = window.location.pathname.split('/');
            const SESSION_ID = pathSegments[pathSegments.length - 1] || '';

            // ============================================================
            // 🎯 DOM REFS
            // ============================================================
            const video = document.getElementById('video');
            const photo = document.getElementById('photo');
            const placeholder = document.getElementById('placeholder');
            const overlay = document.getElementById('overlay');

            const btnStart = document.getElementById('btnStart');
            const btnCapture = document.getElementById('btnCapture');
            const btnRetake = document.getElementById('btnRetake');
            const btnSend = document.getElementById('btnSend');

            const statusDiv = document.getElementById('status');
            const loader = document.getElementById('loader');
            const sessionIdDisplay = document.getElementById('sessionId');
            const statusBadge = document.getElementById('statusBadge');

            // ============================================================
            // 📦 STATE
            // ============================================================
            let stream = null;
            let capturedPhoto = null; // Data URL foto
            let isCameraReady = false;
            let isSending = false;

            // ============================================================
            // 🚀 INISIALISASI
            // ============================================================
            function init() {
                // Tampilkan session ID
                if (SESSION_ID && SESSION_ID.length === 8) {
                    sessionIdDisplay.textContent = SESSION_ID;
                } else {
                    sessionIdDisplay.textContent = '❌ Invalid';
                    showStatus('Session ID tidak valid!', 'error');
                }

                // Cek status session ke server
                checkSession();

                // Event listeners
                btnStart.addEventListener('click', startCamera);
                btnCapture.addEventListener('click', capturePhoto);
                btnRetake.addEventListener('click', retakePhoto);
                btnSend.addEventListener('click', sendPhoto);
            }

            // ============================================================
            // 🔍 CEK SESSION KE SERVER
            // ============================================================
            async function checkSession() {
                if (!SESSION_ID || SESSION_ID.length !== 8) return;

                try {
                    const res = await fetch(`${API_BASE}/check/${SESSION_ID}`);
                    const data = await res.json();

                    if (data.success) {
                        if (data.status === 'completed') {
                            updateBadge('done', '✅ Selesai');
                            showStatus('Session ini sudah selesai. Foto sudah terkirim.', 'info');
                            disableAllButtons();
                        } else {
                            updateBadge('waiting', '⏳ Menunggu');
                        }
                    } else {
                        showStatus('Session tidak ditemukan atau expired.', 'error');
                        disableAllButtons();
                    }
                } catch (err) {
                    console.error('Check session error:', err);
                }
            }

            // ============================================================
            // 📷 KAMERA
            // ============================================================
            async function startCamera() {
                try {
                    // Reset state
                    if (stream) {
                        stream.getTracks().forEach(t => t.stop());
                        stream = null;
                    }

                    // Minta akses kamera
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    });

                    video.srcObject = stream;
                    await video.play();

                    // Tampilkan video, sembunyikan placeholder
                    video.style.display = 'block';
                    placeholder.style.display = 'none';
                    overlay.classList.add('active');

                    isCameraReady = true;
                    btnStart.disabled = true;
                    btnCapture.disabled = false;
                    btnStart.textContent = '✅ Aktif';

                    showStatus('Kamera aktif! Posisikan wajah di dalam bingkai.', 'info');

                } catch (err) {
                    console.error('Camera error:', err);
                    showStatus('Gagal akses kamera. Pastikan izinkan akses kamera.', 'error');
                    btnStart.disabled = false;
                    btnStart.textContent = '📷 Mulai';
                }
            }

            // ============================================================
            // 📸 CAPTURE PHOTO
            // ============================================================
            function capturePhoto() {
                if (!isCameraReady || !stream) {
                    showStatus('Kamera belum siap!', 'error');
                    return;
                }

                // Ambil frame dari video
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 1280;
                canvas.height = video.videoHeight || 720;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Konversi ke data URL
                capturedPhoto = canvas.toDataURL('image/jpeg', 0.92);

                // Tampilkan di img
                photo.src = capturedPhoto;
                photo.style.display = 'block';
                video.style.display = 'none';
                overlay.classList.remove('active');

                // Update buttons
                btnCapture.disabled = true;
                btnRetake.style.display = 'flex';
                btnSend.style.display = 'flex';

                showStatus('Foto berhasil diambil! Klik Kirim untuk mengirim.', 'success');
            }

            // ============================================================
            // 🔄 RETAKE
            // ============================================================
            function retakePhoto() {
                // Kembali ke mode kamera
                photo.style.display = 'none';
                video.style.display = 'block';
                overlay.classList.add('active');

                capturedPhoto = null;

                btnCapture.disabled = false;
                btnRetake.style.display = 'none';
                btnSend.style.display = 'none';

                showStatus('Ambil ulang foto. Posisikan wajah di dalam bingkai.', 'info');
                hideStatus();
            }

            // ============================================================
            // 📤 SEND PHOTO
            // ============================================================
            async function sendPhoto() {
                if (!capturedPhoto || isSending) return;

                isSending = true;
                loader.classList.add('active');
                btnSend.disabled = true;
                btnRetake.disabled = true;
                showStatus('Mengirim foto...', 'info');

                try {
                    // Konversi data URL ke Blob
                    const blob = dataURLToBlob(capturedPhoto);

                    // Buat FormData
                    const formData = new FormData();
                    formData.append('photo', blob, 'face.jpg');

                    // Kirim ke server
                    const res = await fetch(`${API_BASE}/capture/${SESSION_ID}`, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await res.json();

                    if (result.success) {
                        showStatus('✅ Foto berhasil terkirim! Terima kasih.', 'success');
                        updateBadge('done', '✅ Selesai');
                        btnSend.style.display = 'none';
                        btnRetake.style.display = 'none';
                        btnCapture.disabled = true;

                        // Matikan kamera
                        if (stream) {
                            stream.getTracks().forEach(t => t.stop());
                            stream = null;
                        }
                    } else {
                        showStatus('❌ Gagal mengirim: ' + (result.message || 'Error'), 'error');
                    }

                } catch (err) {
                    console.error('Send error:', err);
                    showStatus('❌ Gagal mengirim foto. Coba lagi.', 'error');
                } finally {
                    isSending = false;
                    loader.classList.remove('active');
                    btnSend.disabled = false;
                    btnRetake.disabled = false;
                }
            }

            // ============================================================
            // 🛠️ UTILITY FUNCTIONS
            // ============================================================

            function dataURLToBlob(dataURL) {
                const parts = dataURL.split(',');
                const mime = parts[0].match(/:(.*?);/)[1];
                const bstr = atob(parts[1]);
                const n = bstr.length;
                const u8arr = new Uint8Array(n);
                for (let i = 0; i < n; i++) {
                    u8arr[i] = bstr.charCodeAt(i);
                }
                return new Blob([u8arr], { type: mime });
            }

            function showStatus(msg, type = 'info') {
                statusDiv.textContent = msg;
                statusDiv.className = type;
            }

            function hideStatus() {
                statusDiv.className = '';
                statusDiv.textContent = '';
            }

            function updateBadge(type, label) {
                statusBadge.className = 'status-badge ' + type;
                statusBadge.textContent = label;
            }

            function disableAllButtons() {
                btnStart.disabled = true;
                btnCapture.disabled = true;
                btnRetake.disabled = true;
                btnSend.disabled = true;
            }

            // ============================================================
            // 🚀 START
            // ============================================================
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
